name: NHL near-lock scanner
on:
  schedule:                    # UTC. One long job per game night; stops by itself when all games are final.
    - cron: "45 23 * * *"      # 4:45 PM PDT / 3:45 PM PST  evening games
    - cron: "30 3 * * *"       # 8:30 PM PDT / 7:30 PM PST  late West Coast games if the first job hit 6 hours
    - cron: "45 18 * * 0,6"    # 11:45 AM PDT weekends  matinees
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert only"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: { group: scan, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography
      - uses: actions/cache/restore@v4
        with: { path: bot_state, key: "bot-${{ github.run_id }}", restore-keys: "bot-" }
      - name: Scan live games
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.NIFTY_TOPIC || secrets.NFTY_TOPIC }}
          NL_TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
          NL_MODE: ${{ vars.NL_MODE || 'LIVE' }}
          NL_ONLY: buy
        run: python nearlock.py 5.8
      - uses: actions/cache/save@v4
        if: always()
        with: { path: bot_state, key: "bot-${{ github.run_id }}" }
      - name: Save logs
        if: always()
        run: |
          git config user.name "nhl-scanner"; git config user.email "nhl-scanner@users.noreply.github.com"
          git add -f out/*.csv out/*.json out/*.txt 2>/dev/null || true
          git commit -m "Scan $(date -u +%F)" && git pull --rebase --autostash && (git push || echo "::warning title=save::git push failed") || true
