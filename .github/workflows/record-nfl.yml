name: NFL price recorder (Test 2, no alerts)
on:
  schedule:                    # UTC; each job stops by itself when no games are live
    - cron: "55 23 * * 4"      # Thursday 4:55 PM PDT  Thursday Night Football
    - cron: "45 12 * * 0"      # Sunday 5:45 AM PDT    London games (stops if none)
    - cron: "45 16 * * 0"      # Sunday 9:45 AM PDT    early + late afternoon games
    - cron: "40 22 * * 0"      # Sunday 3:40 PM PDT    late games + Sunday Night Football
    - cron: "55 23 * * 1"      # Monday 4:55 PM PDT    Monday Night Football
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: one snapshot of the next game's markets"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: { group: record-nfl, cancel-in-progress: false }
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Record
        run: python record_nfl.py ${{ (github.event_name == 'workflow_dispatch' && inputs.probe) && '--probe' || '' }}
      - name: Save
        if: always()
        run: |
          git config user.name "nhl-scanner"; git config user.email "nhl-scanner@users.noreply.github.com"
          git add -f out/nfl_rec_* 2>/dev/null || true
          git commit -m "NFL price recording $(date -u +%F)" && git pull --rebase -X theirs --autostash && git push || echo "::warning title=save::push failed"
