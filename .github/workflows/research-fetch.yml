name: Research data pull (public market prices only)
on:
  workflow_dispatch:
    inputs:
      script: { description: "script in research/", default: "pm_nhl_early.py" }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python research/${{ inputs.script }}
      - name: Save
        if: always()
        run: |
          git config user.name "nhl-scanner"; git config user.email "nhl-scanner@users.noreply.github.com"
          git add -f research/*.json.gz research/*_log.txt
          git commit -qm "Research: NHL early-game price history" && git pull --rebase -X theirs --autostash && git push || true
