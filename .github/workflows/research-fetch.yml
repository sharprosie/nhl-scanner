name: Research data pull (public market prices only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python research/pm_nhl_early.py
      - name: Save
        if: always()
        run: |
          git config user.name "nhl-scanner"; git config user.email "nhl-scanner@users.noreply.github.com"
          git add -f research/pm_nhl_early_2025.json.gz research/pm_early_log.txt
          git commit -qm "Research: NHL early-game price history" && git pull --rebase -X theirs --autostash && git push || true
