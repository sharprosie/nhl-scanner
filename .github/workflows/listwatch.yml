name: Listing watcher - when Polymarket posts next week's football games (market data only)
on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: listwatch, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python listwatch.py
      - name: Save
        run: |
          git config user.name "nhl-scanner"; git config user.email "nhl-scanner@users.noreply.github.com"
          git add out/listings.csv 2>/dev/null || exit 0
          git commit -qm "Listings $(date -u +%F' '%H:%M)" || exit 0
          git pull --rebase -X theirs --autostash && git push || echo "::warning title=save::push failed"
